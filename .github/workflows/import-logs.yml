name: Import access logs to GoatCounter

# Nightly: fetch Inleed's rotated nginx logs over FTP, keep yesterday's real
# page views (see scripts/filter_access_log.py) and send them to GoatCounter.
# Imports are not deduplicated, so only run each date once.

on:
  schedule:
    - cron: '30 3 * * *'  # 05:30 Stockholm (summer time), after log rotation
  workflow_dispatch:
    inputs:
      from:
        description: 'First date to import (YYYY-MM-DD), default yesterday'
        required: false
      to:
        description: 'Last date to import (YYYY-MM-DD), default same as from'
        required: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GOATCOUNTER_VERSION: v2.7.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick dates
        id: dates
        run: |
          from="${{ inputs.from }}"
          [ -n "$from" ] || from=$(TZ=Europe/Stockholm date -d yesterday +%F)
          to="${{ inputs.to }}"
          [ -n "$to" ] || to="$from"
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"

      - name: Download logs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p logs && cd logs
          auth="$FTP_USERNAME:$FTP_PASSWORD"
          for f in $(curl -sS --list-only --user "$auth" "ftp://$FTP_SERVER/logs/" | grep '^nginx\..*\.tar\.gz'); do
            curl -sS --user "$auth" -o "$f" "ftp://$FTP_SERVER/logs/$f"
            mkdir "x-$f" && tar -xzf "$f" -C "x-$f"
          done
          ls x-*/ | head -50

      - name: Filter page views
        run: |
          python3 scripts/filter_access_log.py \
            --from ${{ steps.dates.outputs.from }} --to ${{ steps.dates.outputs.to }} \
            $(find logs -path '*/x-*' -name '*.log*' ! -name '*error*') > pageviews.log

      - name: Import to GoatCounter
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          if [ ! -s pageviews.log ]; then echo "No page views to import"; exit 0; fi
          curl -sSL "https://github.com/arp242/goatcounter/releases/download/$GOATCOUNTER_VERSION/goatcounter-$GOATCOUNTER_VERSION-linux-amd64.gz" | gunzip > goatcounter
          chmod +x goatcounter
          ./goatcounter import -silent -format=combined \
            -site=https://kristoferhallen.goatcounter.com pageviews.log
