{{- with site.Params.author }}
<header class="intro">
    <h1 class="intro-name">{{ .intro }}</h1>
    <p class="intro-lead">{{ .lead }}</p>
    <p class="intro-role">{{ .tagline }}</p>
    <p class="intro-proof">{{ .proof | $.RenderString }}</p>
    <p class="intro-links">
        <a href="{{ .linkedin }}">Follow me on LinkedIn</a> · <a href="{{ "pages/about/" | relURL }}">Talks and publications</a>
    </p>
</header>
{{- end }}
